<div id="customUploadContainer" class="hidden-field" style="margin-top: 8px;">
  <input type="file" id="logoUpload" accept="image/*">
  <div class="control-group" id="logoSizeControl" style="margin-top: 8px;">
    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted);">
      <span>Logo Size</span>
      <span id="logoSizeVal">22%</span>
    </div>
    <input type="range" id="logoSizeSlider" min="10" max="30" value="22" step="1" style="width: 100%; cursor: pointer;">
  </div>
</div>
